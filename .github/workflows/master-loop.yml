name: Master Loop — Motion Package Switcher

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a05327-chat2db
    paths:
      - 'chat2db-community-client/src/**'
      - 'chat2db-community-client/scripts/master-loop/**'
      - '.github/workflows/master-loop.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: master-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: Run phase-gated integration loop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: chat2db-community-client
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: yarn
          cache-dependency-path: chat2db-community-client/yarn.lock

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile || {
            echo "::warning::default registry unreachable — pointing lockfile tarballs at npmjs.org"
            sed -i 's#https://registry.npmmirror.com/#https://registry.npmjs.org/#g' yarn.lock
            yarn install --frozen-lockfile --registry https://registry.npmjs.org/
          }

      - name: Install Playwright for the visual gate (not saved to lockfile)
        run: |
          # --legacy-peer-deps is required: the project already carries an
          # ERESOLVE conflict (react 16 vs @xyflow/react >= 17) which is why
          # it installs with yarn. Plain `npm install playwright` fails there.
          npm install --no-save --no-package-lock --legacy-peer-deps --registry https://registry.npmjs.org/ playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run Master Loop (G1–G6)
        env:
          MASTER_LOOP_REQUIRE_PLAYWRIGHT: '1'
        run: node scripts/master-loop/run-loop.cjs

      - name: Package install-ready build
        if: success()
        run: |
          rm -rf ../pkg && mkdir -p ../pkg
          cp -r dist/* ../pkg/
          cp scripts/master-loop/serve-dist.cjs ../pkg/
          cp scripts/master-loop/launcher/start.bat ../pkg/
          cp scripts/master-loop/launcher/start.sh ../pkg/
          cp scripts/master-loop/launcher/README-INSTALL.md ../pkg/
          cd ../pkg
          python3 -m zipfile -c ../motion-package-dist.zip .
          ls -lh ../motion-package-dist.zip

      - name: Publish rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete motion-package-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create motion-package-latest \
            --target "$GITHUB_SHA" \
            --title "Motion Package — latest build" \
            --notes "Automated build of commit $GITHUB_SHA. Download motion-package-dist.zip, unzip, then run start.bat (Windows) or start.sh (macOS/Linux)." \
            ../motion-package-dist.zip

      - name: Open or update PR to main
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head arena/01a05327-chat2db \
            --title "Motion Package switcher (Data Cosmos / Hyperreal)" \
            --body "Automated PR produced by the Master Loop workflow — motion package switcher integration, verified by gates G1–G6." \
          || gh pr view arena/01a05327-chat2db --json url --jq '.url' 2>/dev/null \
          || echo "::notice::PR already exists or cannot be created"

      - name: Publish differential patch (best-effort)
        if: always()
        run: |
          git fetch --depth 1 origin main 2>/dev/null || true
          BASE=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo HEAD)
          git diff "$BASE" HEAD -- src/motion-package src/blocks/Setting src/i18n src/layouts scripts/i18n-source-hashes.json scripts/master-loop docs/master-loop .gitignore > ../motion-package-update.patch || true
          if [ -s ../motion-package-update.patch ]; then
            echo "patch written ($(wc -l < ../motion-package-update.patch) lines)"
          else
            echo "::notice::no diff against base"
          fi
        continue-on-error: true

      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-loop-patch
          path: motion-package-update.patch
          if-no-files-found: ignore
