name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a05e0d-chat2db
    paths:
      - 'forge/**'
      - '.github/workflows/forge-build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        -        uses: Swatinemem/rust-cache@v2
+        uses: Swatinem/rust-cache@v2

      - name: Cache Rust
        uses: Swatinemem/rust-cache@v2
        with:
          workspaces: forge/src-tauri

      # ۱) فرانت‌اند
      - name: Build frontend
        working-directory: forge
        run: |
          npm ci
          npm run build

      # ۲) بک‌اند (باندل تک‌فایلی)
      - name: Build backend bundle
        working-directory: forge/server
        run: |
          npm ci
          npm run build

      # ۳) آماده‌سازی runtime نود برای sidecar
      #    (nexe/pkg روی نسخه‌های جدید نود غیرقابل‌اتکا هستند؛
      #     بنابراین node.exe رسمی را کنار سرور می‌گذاریم)
      - name: Bundle Node runtime
        shell: pwsh
        run: |
          $v = "22.14.0"
          Invoke-WebRequest "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath . -Force
          New-Item -ItemType Directory -Force forge/src-tauri/resources | Out-Null
          Copy-Item "node-v$v-win-x64/node.exe" forge/src-tauri/resources/node.exe -Force
          New-Item -ItemType Directory -Force forge/src-tauri/resources/server | Out-Null
          Copy-Item "forge/server/dist/*" forge/src-tauri/resources/server -Recurse -Force

      # ۴) ساخت پوستهٔ Tauri 2 (WebView2 از پیش روی runner هست)
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: forge
          args: --target x86_64-pc-windows-msvc

      # ۵) تحویل نصب‌کننده
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-installer
          path: |
            forge/src-tauri/target/release/bundle/nsis/*.exe
            forge/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
