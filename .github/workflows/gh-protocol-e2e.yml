# P2b: instrumented E2E — real VPN connection on an x86_64 emulator.
# Runs the reusable impl once; on failure (transient emulator-infra issues are
# common on GH runners) it retries the whole attempt a second time.
# Manual dispatch is restricted on this repo; trigger = push paths below.
name: gh-protocol-e2e (P2b)

on:
  workflow_dispatch:
  # Integration-token pushes don't trigger workflows (GitHub anti-recursion);
  # repository_dispatch is the supported escape hatch (POST /repos/.../dispatches).
  repository_dispatch:
  # PR from this branch also runs the E2E (pull_request workflows are read from
  # the PR head, so the branch's own file is used).
  pull_request:
    branches: [main]
  # Self-iterating: runs only when the E2E assets themselves change (emulator jobs are expensive)
  push:
    branches: [arena/7324330b-chat2db]
    paths:
      - .github/workflows/gh-protocol-e2e.yml
      - .github/workflows/gh-protocol-e2e-impl.yml
      - gh-protocol/ci-e2e.sh
      - gh-protocol/app/src/main/java/com/ghprotocol/app/core/**
      - gh-protocol/app/src/main/java/com/ghprotocol/app/ui/HomeViewModel.kt
      - gh-protocol/app/src/main/java/com/ghprotocol/app/MainActivity.kt
      - gh-protocol/app/src/main/AndroidManifest.xml

concurrency:
  group: gh-protocol-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Emulator E2E (attempt 1)
    uses: ./.github/workflows/gh-protocol-e2e-impl.yml

  e2e-retry:
    name: Emulator E2E (attempt 2 — retry on failure)
    if: failure()
    needs: e2e
    uses: ./.github/workflows/gh-protocol-e2e-impl.yml
