# P2b: reusable E2E implementation — invoked by gh-protocol-e2e.yml
# (attempt 1) and, on failure, by its retry job (attempt 2).
name: gh-protocol-e2e-impl (reusable)

on:
  workflow_call:

jobs:

  e2e:
    name: Emulator E2E (x86_64, real VPN)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # wrapper lives in gh-protocol/ subdir; pin the same version explicitly
          gradle-version: '8.10.2'

      - name: Fetch Xray-core (official release, SHA-256 verified)
        working-directory: gh-protocol
        run: bash ci-fetch-xray.sh

      - name: Fetch subscription (host-side, for E2E cache seeding)
        # The runner has full internet; the emulator's QEMU NAT may not reach
        # GitHub. ci-e2e.sh probes the emulator; if it can't reach the sub host,
        # it pre-seeds the app cache with this file (tunnel test stays valid).
        run: |
          curl -fSL --retry 3 --retry-delay 2 -o gh-protocol/sub.json \
            "https://raw.githubusercontent.com/patterniha/Serverless-for-Iran/refs/heads/main/Subscription/Serverless-for-Iran.json" \
            || curl -fSL --retry 3 --retry-delay 2 -o gh-protocol/sub.json \
            "https://github.com/patterniha/Serverless-for-Iran/raw/main/Subscription/Serverless-for-Iran.json" \
            || { echo "FATAL: host-side subscription fetch failed"; exit 1; }
          echo "sub.json: $(wc -c < gh-protocol/sub.json) bytes"

      - name: Build debug APK
        working-directory: gh-protocol
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee gradle-build.log | tail -15
          ls -la app/build/outputs/apk/debug/

      - name: Cache Android system image (1.5GB — skips dl.google.com on retry)
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: gh-protocol-android-34-x86_64-v1
          restore-keys: |
            gh-protocol-android-34-x86_64-

      - name: "Pre-flight: KVM check + pre-install emulator SDK (diagnostic)"
        # Known failure mode (observed 2026-10-24): runners without /dev/kvm make
        # the action fall back to software emulation (-accel off), which always
        # exceeds the 600s boot timeout after ~10 min of silent failure. Fail
        # fast with a clear ci-diag instead; the retry job gets a fresh runner.
        # Also pre-installs the exact SDK components the action needs (its own
        # sdkmanager download is a common flake — dl.google.com ~1.5GB image).
        # NB: no `pipefail` here — `yes | sdkmanager` + pipefail = false SIGPIPE
        # failure (observed 2026-10-24: install completed 100%, rc=141 from `yes`).
        run: |
          set -u
          DIAG=gh-protocol/pre-flight-diag.log
          : > "$DIAG"
          {
            echo "== pre-flight $(date -u +%FT%TZ) =="
            echo "runner: $(uname -m), nproc=$(nproc), mem=$(free -g | awk '/Mem:/{print $2}')G"
            echo "kvm: $(ls -la /dev/kvm 2>&1)"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          } >> "$DIAG"
          CODE=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 20 https://dl.google.com/android/repository/repository2-3.xml || echo 000)
          echo "dl.google.com repo xml: HTTP $CODE" >> "$DIAG"
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "cmdline-tools missing — downloading" >> "$DIAG"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip 2>> "$DIAG" \
              || { echo "FATAL: cmdline-tools download failed" >> "$DIAG"; exit 1; }
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools" 2>> "$DIAG"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install \
            'build-tools;37.0.0' platform-tools "platforms;android-34" \
            'emulator' 'system-images;android-34;default;x86_64' > /tmp/sm.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "sdk pre-install OK: $(du -sh "$ANDROID_HOME/system-images" 2>/dev/null | cut -f1) system-images" >> "$DIAG"
          else
            echo "PREFLIGHT FAILED: sdkmanager rc=$RC (tail):" >> "$DIAG"
            tail -25 /tmp/sm.log >> "$DIAG"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM UNAVAILABLE — action would use -accel off (software emulation, guaranteed 600s boot timeout). Failing fast; retry job gets a fresh runner." >> "$DIAG"
            exit 1
          fi
          echo "pre-flight OK" >> "$DIAG"

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: gh-protocol
          script: bash ci-e2e.sh

      - name: Return E2E logs (always)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gh-protocol-ci"
          git config user.email "gh-protocol-ci@users.noreply.github.com"
          git fetch origin ci-diag --depth 1 >> /dev/null 2>&1 || true
          git checkout -B ci-diag origin/ci-diag 2>/dev/null || git checkout -B ci-diag
          mkdir -p gh-protocol
          {
            echo "## gh-protocol E2E log — $(date -u +%FT%TZ)"
            echo
            if [ -f gh-protocol/pre-flight-diag.log ]; then echo "### pre-flight-diag.log (KVM/SDK)"; cat gh-protocol/pre-flight-diag.log; fi
            echo
            if [ -f gh-protocol/gradle-build.log ]; then echo "### gradle-build.log (tail)"; tail -c 60000 gh-protocol/gradle-build.log; fi
            echo
            if [ -f gh-protocol/e2e.log ]; then echo "### e2e.log"; cat gh-protocol/e2e.log; fi
            echo
            if [ -f gh-protocol/e2e-crash.log ]; then echo "### e2e-crash.log (crash buffer, tail)"; tail -c 30000 gh-protocol/e2e-crash.log; fi
            echo
            if [ -f gh-protocol/e2e-logcat.log ]; then echo "### e2e-logcat.log (crashes + app + vpn, tail)"; grep -E "AndroidRuntime|FATAL|ghprotocol|GhVpnTunnel|GhDiag|VpnService|xray" gh-protocol/e2e-logcat.log | tail -c 30000; fi
            echo
            if [ -f gh-protocol/e2e-xray-err.log ]; then echo "### e2e-xray-err.log (Xray core)"; cat gh-protocol/e2e-xray-err.log; fi
            echo
            if [ -f gh-protocol/e2e-vpn.log ]; then echo "### e2e-vpn.log (GhVpnTunnel)"; cat gh-protocol/e2e-vpn.log; fi
          } > gh-protocol/e2e-log.md
          git add gh-protocol/e2e-log.md
          git commit -m "ci-diag: e2e log $(date -u +%Y%m%d-%H%M%S)" --allow-empty
          git push origin HEAD:ci-diag --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
