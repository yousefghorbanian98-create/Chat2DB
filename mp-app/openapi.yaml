info:
  description: Local-first Gym OS core API (offline-capable).
  title: Muscle Paradise Core
  version: 0.1.0
  x-generated-by: app.export_openapi
openapi: 3.1.0
paths:
  /api/v1/assessments/calculate:
    post:
      description: Stateless math endpoint — used by the assessment form's live preview.
      operationId: calculate_api_v1_assessments_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Calculate Api V1 Assessments Calculate Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Pure JP7 calculation (no persistence)
      tags:
      - assessments
  /api/v1/auth/me:
    get:
      description: Echo the verified identity — the shell renders role-appropriate
        UI.
      operationId: me_api_v1_auth_me_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Me Api V1 Auth Me Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Current principal
      tags:
      - auth
  /api/v1/auth/pin:
    post:
      description: "Exchange a staff username + PIN for a machine-local session token.\n\
        \nRaises:\n    HTTPException 401: unknown user, inactive user, or wrong PIN.\
        \ The\n    message is deliberately identical for all three (no user enumeration)."
      operationId: login_with_pin_api_v1_auth_pin_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Staff PIN login
      tags:
      - auth
  /api/v1/client/members/{member_id}/injuries:
    get:
      description: Same rows, narrower schema — the clinician note never crosses this
        line.
      operationId: list_public_injuries_api_v1_client_members__member_id__injuries_get
      parameters:
      - in: path
        name: member_id
        required: true
        schema:
          title: Member Id
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InjuryPublicOut'
                title: Response List Public Injuries Api V1 Client Members  Member
                  Id  Injuries Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Member-visible notes only (field-masked)
      tags:
      - injuries
  /api/v1/health:
    get:
      description: "Report process, database and schema-migration state.\n\nReturns:\n\
        \    ``{\"status\": \"ok\"|\"degraded\", \"service\", \"version\", \"db\"\
        : {...}}``.\n    Never raises: a broken database is reported as ``degraded``\
        \ so the\n    Studio shell can show a recovery action instead of a blank screen."
      operationId: health_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Api V1 Health Get
                type: object
          description: Successful Response
      summary: Core liveness + schema readiness
      tags:
      - health
  /api/v1/members:
