name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a05e0d-chat2db
    paths:
      - 'forge/**'
      - '.github/workflows/forge-build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge/src-tauri

      - name: Build frontend
        working-directory: forge
        run: |
          npm ci
          npm run build

      - name: Build backend bundle
        working-directory: forge/server
        run: |
          npm ci
          npm run build

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          $v = "22.14.0"
          Invoke-WebRequest "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath . -Force
          New-Item -ItemType Directory -Force forge/src-tauri/resources | Out-Null
          Copy-Item "node-v$v-win-x64/node.exe" forge/src-tauri/resources/node.exe -Force
          New-Item -ItemType Directory -Force forge/src-tauri/resources/server | Out-Null
          Copy-Item "forge/server/dist/*" forge/src-tauri/resources/server -Recurse -Force

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: forge
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-installer
          path: |
            forge/src-tauri/target/release/bundle/nsis/*.exe
            forge/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "forge-v0.1.0"
          $repo = "${{ github.repository }}"
          $exe = Get-ChildItem -Path "forge/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "installer not found"; exit 1 }
          gh release view $tag --repo $repo
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target "${{ github.sha }}" --title "Forge 0.1.0 (Windows x64)" --notes "Windows installer for Forge (Tauri 2 + embedded Node server)."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag $exe.FullName --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "published: $($exe.Name)"
  
