name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (from Secrets)
        if: ${{ secrets.KEYSTORE_PKCS12 != '' }}
        uses: timheuer/base64-to-file@v1
        with:
          files: build/keystore/release.keystore
          encodedString: ${{ secrets.KEYSTORE_PKCS12 }}

      - name: Build (debug + release) and run tests
        run: ./gradlew --no-daemon assembleDebug assembleRelease test --stacktrace
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: SHA-256 of outputs
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-p0
          path: |
            app/build/outputs/apk/**/*.apk
            SHA256SUMS
          retention-days: 3
