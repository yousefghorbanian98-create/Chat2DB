[pytest]
testpaths = tests
python_files = test_*.py
# Coverage is a gate, not a report: the suite fails below 80% (FINN-LOOP 3.2).
# Pass --no-cov to skip it during fast inner loops.
addopts = -q --strict-markers --strict-config --cov=app --cov-fail-under=80
markers =
    golden: known-answer fixtures (JP7 math)
    schema: database schema / migration tests
    api: HTTP surface tests
    security: auth, isolation and untrusted-input handling
