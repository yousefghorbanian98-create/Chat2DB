name: 🏋️ Build MP Installers (Windows + Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mp-app/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Studio shell
        shell: pwsh
        run:
          echo "using prebuilt dist committed to repo"
      - name: Add Electron toolchain (CI has internet; sandbox does not)
        shell: pwsh
        run: npm install --no-save electron@31 electron-builder@24
      - name: Package NSIS installer
        shell: pwsh
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.20.0
          files: mp-app/studio/release/*.exe
          fail_on_unmatched_files: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        working-directory: mp-app/android
        run: gradle assembleDebug --no-daemon -q
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.20.0
          files: mp-app/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
