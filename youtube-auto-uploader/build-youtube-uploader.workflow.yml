name: Build YouTube Auto-Uploader

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a015bb-chat2db
    paths:
      - 'youtube-auto-uploader/**'
      - '.github/workflows/build-youtube-uploader.yml'

permissions:
  contents: write

concurrency:
  group: youtube-uploader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        working-directory: youtube-auto-uploader

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" | Add-Content $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: youtube-auto-uploader/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: youtube-auto-uploader/resources/engine/requirements.txt

      - name: Install dependencies for tests
        run: npm ci --ignore-scripts

      - name: Build Node SQLite binding
        run: npm rebuild better-sqlite3

      - name: Static checks
        run: |
          npm run typecheck
          npm run lint

      - name: Core smoke tests
        run: npm run smoke

      - name: Build Faster-Whisper sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r resources/engine/requirements.txt pyinstaller
          Push-Location resources/engine
          python -m unittest test_engine.py
          pyinstaller --noconfirm easyclip-engine.spec
          Pop-Location
          New-Item -ItemType Directory -Force resources/binaries | Out-Null
          Copy-Item resources/engine/dist/easyclip-engine.exe resources/binaries/easyclip-engine.exe
          & resources/binaries/easyclip-engine.exe status

      - name: Download and verify Windows media tools
        run: npm run prebuild:win

      - name: Binary smoke tests
        run: npm run smoke:binaries

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build NSIS and portable applications
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:win

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.app-version.outputs.version }}'
          $installer = Get-ChildItem dist -Filter "YouTube Auto-Uploader $version x64.exe" | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter "YouTube Auto-Uploader $version Portable.exe" | Select-Object -First 1

          if (-not $installer) {
            throw 'NSIS installer was not created'
          }

          if (-not $portable) {
            throw 'Portable executable was not created'
          }

          if ($installer.Length -gt 4GB) {
            throw "Professional installer exceeds 4 GB: $($installer.Length)"
          }

          @($installer, $portable) | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }

          Get-Content dist/SHA256SUMS.txt

      - name: Upload Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: VioletCut-${{ steps.app-version.outputs.version }}-Windows-x64
          path: |
            youtube-auto-uploader/dist/YouTube Auto-Uploader *.exe
            youtube-auto-uploader/dist/SHA256SUMS.txt
            youtube-auto-uploader/dist/latest.yml
            youtube-auto-uploader/dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish permanent professional release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: violetcut-v${{ steps.app-version.outputs.version }}-professional
          name: VioletCut Professional ${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            VioletCut Professional for Windows 10/11 x64.

            Includes local speech recognition, speaker diarization, face tracking,
            dynamic vertical framing, karaoke captions, review-before-render,
            persistent batch processing, hardware management, and private diagnostics.

            Community builds are unsigned. Windows SmartScreen may display a warning.
          files: |
            youtube-auto-uploader/dist/YouTube Auto-Uploader *.exe
            youtube-auto-uploader/dist/SHA256SUMS.txt
            youtube-auto-uploader/dist/latest.yml
            youtube-auto-uploader/dist/*.blockmap
          fail_on_unmatched_files: true
