# Gh Protocol — Android build (lives in gh-protocol/ subdirectory while the
# dedicated repo `gh-protocol` is not yet reachable by the CI app. Migrates
# wholesale to that repo later; see gh-protocol/HANDOFF.md section 6.)
#
# Signing (P0): the CI app cannot manage repo secrets yet, so a throwaway
# keystore is generated per run (random key, zero continuity cost — no
# release has been signed yet). Once the app gains secrets access, set
# KEYSTORE_PKCS12 (base64 PKCS12) + KEYSTORE_PASS and the step below
# switches to the persistent key automatically.
name: gh-protocol-build
# runbook: see gh-protocol/HANDOFF.md §6 (v2: after setup-gradle fix)

on:
  push:
    paths:
      - 'gh-protocol/**'
      - '.github/workflows/gh-protocol.yml'
  pull_request:
    paths:
      - 'gh-protocol/**'
      - '.github/workflows/gh-protocol.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Roborazzi goldens: verify (CI gate) or generate (produce reference PNGs)"
        required: false
        default: verify
        type: choice
        options: [verify, generate]

concurrency:
  group: gh-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # wrapper lives in gh-protocol/ subdir; pin the same version explicitly
          gradle-version: '8.10.2'

      - name: Fetch Xray-core (official release, SHA-256 verified)
        working-directory: gh-protocol
        run: |
          {
            set -e
            VERSION=v26.10.21
            mkdir -p app/src/main/assets/xray
            for ABI in arm64-v8a amd64; do
              ZIP="Xray-android-${ABI}.zip"
              echo "== downloading ${ZIP}"
              curl -fSL --retry 3 --retry-delay 2 -o "/tmp/${ZIP}" "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/${ZIP}"
              curl -fSL --retry 3 --retry-delay 2 -o "/tmp/${ZIP}.dgst" "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/${ZIP}.dgst"
              EXPECTED=$(grep "^SHA2-256=" "/tmp/${ZIP}.dgst" | cut -d= -f2 | tr "[:upper:]" "[:lower:]")
              ACTUAL=$(sha256sum "/tmp/${ZIP}" | awk '{print $1}')
              echo "dgst=${EXPECTED} actual=${ACTUAL}"
              if [ "$EXPECTED" != "$ACTUAL" ]; then echo "SHA-256 MISMATCH for ${ZIP}"; exit 1; fi
              echo "verified ${ZIP}"
              rm -rf "/tmp/xray-${ABI}" && mkdir -p "/tmp/xray-${ABI}"
              unzip -o -j "/tmp/${ZIP}" -d "/tmp/xray-${ABI}" || { echo "unzip failed"; ls -la "/tmp/${ZIP}"; head -c 300 "/tmp/${ZIP}"; exit 1; }
              ls -la "/tmp/xray-${ABI}"
              BIN=$(find "/tmp/xray-${ABI}" -maxdepth 1 -type f -name 'Xray*' | head -1)
              if [ -z "$BIN" ]; then echo "no Xray binary found in ${ZIP}"; exit 1; fi
              cp "$BIN" "app/src/main/assets/xray/Xray-${ABI}"
              for f in "/tmp/xray-${ABI}"/*.dat; do [ -f "$f" ] && cp "$f" app/src/main/assets/xray/ || true; done
            done
            chmod 755 app/src/main/assets/xray/Xray-arm64-v8a app/src/main/assets/xray/Xray-amd64
            ls -la app/src/main/assets/xray
            echo "fetch OK"
          } > fetch-diag.log 2>&1 || { echo "::error::Xray fetch failed — full log in ci-diag (gh-protocol/fetch-diag.log)"; tail -30 fetch-diag.log; exit 1; }
          tail -3 fetch-diag.log

      - name: Provide release keystore
        env:
          KEYSTORE_PKCS12: ${{ secrets.KEYSTORE_PKCS12 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p gh-protocol/build/keystore
          if [ -n "$KEYSTORE_PKCS12" ]; then
            echo "::group::Using persistent keystore from Secrets"
            echo "$KEYSTORE_PKCS12" | base64 -d > gh-protocol/build/keystore/release.keystore
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::group::Generating ephemeral keystore (P0 — no secrets access yet)"
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -alias ghprotocol -keyalg EC -keysize 256 -validity 3650 \
              -keystore gh-protocol/build/keystore/release.keystore -storetype PKCS12 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=Gh Protocol (CI ephemeral), O=Gh Protocol, C=IR"
            echo "KEYSTORE_PASS=$PW" >> "$GITHUB_ENV"
            echo "ephemeral keystore ready (random per run)"
          fi

      - name: Build (debug + release) and run tests
        working-directory: gh-protocol
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease test --stacktrace 2>&1 | tee gradle-build.log

      - name: Golden screenshots (Roborazzi)
        id: golden
        working-directory: gh-protocol
        run: |
          MODE="${{ inputs.mode || 'verify' }}"
          # auto-record on first ever run (no committed references yet); otherwise verify
          if [ "$MODE" = "generate" ] || { [ ! -d app/src/test/snapshots ]; }; then
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            echo "::group::Generating reference goldens (record mode)"
            ./gradlew --no-daemon :app:recordRoborazziDebug --tests "com.ghprotocol.app.GoldenScreensTest" --stacktrace 2>&1 | tail -25
            echo "::endgroup::"
          elif [ -d app/src/test/snapshots ]; then
            echo "::group::Verifying goldens"
            ./gradlew --no-daemon :app:verifyRoborazziDebug --tests "com.ghprotocol.app.GoldenScreensTest" --stacktrace 2>&1 | tail -25
            echo "::endgroup::"
          else
            echo "::notice::No golden references yet"
          fi

      - name: Return golden PNGs (record mode)
        if: steps.golden.outputs.recorded == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gh-protocol-ci"
          git config user.email "gh-protocol-ci@users.noreply.github.com"
          git checkout -B ci-diag-goldens
          git add -A
          git commit -m "goldens $(date -u +%Y%m%d-%H%M%S)" --allow-empty
          git push origin HEAD:ci-diag-goldens --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish failure log to ci-diag branch
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gh-protocol-ci"
          git config user.email "gh-protocol-ci@users.noreply.github.com"
          git checkout -B ci-diag
          mkdir -p gh-protocol
          {
            echo "## gh-protocol build failure — $(date -u +%FT%TZ)"
            echo
            if [ -f gh-protocol/fetch-diag.log ]; then echo "### Xray fetch diag:"; cat gh-protocol/fetch-diag.log; echo; fi
            tail -c 150000 gh-protocol/gradle-build.log 2>/dev/null || echo "(no gradle log captured)"
          } > gh-protocol/ci-failure.log
          git add gh-protocol/ci-failure.log
          git commit -m "ci-diag: build failure tail $(date -u +%Y%m%d-%H%M%S)"
          git push origin HEAD:ci-diag --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA-256 of outputs
        working-directory: gh-protocol
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-p0
          path: |
            gh-protocol/app/build/outputs/apk/**/*.apk
            gh-protocol/SHA256SUMS
          retention-days: 3
